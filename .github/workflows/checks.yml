name: Checks
on: [push, pull_request]
jobs:
  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python3 -m unittest discover -s tests -v
      - run: bash -n tools/launcher-addon.sh
      - name: Verify bundled mod DLL checksums
        run: sha256sum --check SHA256SUMS
      - name: Validate binary and manifest presence
        run: |
          test -s mods/PortMasterRumble/PortMasterRumble.dll
          test -s mods/PortMasterTouch/PortMasterTouch.dll
          test -s mods/PortMasterRumble/manifest.json
          test -s mods/PortMasterTouch/manifest.json
